<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remi - AI Student Assistant</title>
    <link rel="stylesheet" href="styles/chat.css"> <!-- This links your crayons (CSS) -->
    <link rel="stylesheet" href="styles/main.css"> <!-- This links your crayons (CSS) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-header sidebar-toggle">
        <i class="fas fa-bars"></i>
      </div>
      <nav class="sidebar-icons">
        <a href="chat.html" class="sidebar-item">
          <i class="fas fa-message"></i>
          <span class="icon-description">Chat</span>
        </a>
        <a href="tasks.html" class="sidebar-item">
          <i class="fas fa-book"></i>
          <span class="icon-description">Tasks</span>
        </a>
        <a href="schedule.html" class="sidebar-item">
          <i class="fas fa-calendar-alt"></i>
          <span class="icon-description">Schedule</span>
        </a>
        <a href="achievements.html" class="sidebar-item">
          <i class="fas fa-lightbulb"></i>
          <span class="icon-description">Achievements</span>
        </a>
        <a href="settings.html" class="sidebar-item">
          <i class="fas fa-cog"></i>
          <span class="icon-description">Settings</span>
        </a>
      </nav>
    </div>
    
    <div class="topbar-menu">
      <img src="pfp/Shinobu-Sticker.png" class="topbar-logo">
      <span class="topbar-title"><img src="pfp/Remi-Logo-removebg-preview (1).png" class="main-logo"></span>
      <div>
        <button class="toggle-dark-button"><i class="fas fa-moon toggle-icon"></i></button>
      </div>
    </div>
    <div class="chat-list">
      <div class="chat-list-buttons">
        <button class="new-chat-button"><i class="fas fa-angle-left"></i></button>
        <button class="list-button-controller"><i class="fas fa-add"></i></button>
        <input type="text" class="search-input" placeholder="Search chats...">
        <button class="search-button"><i class="fas fa-search"></i></button>
      </div>
      <div class="chat-list-container" id="chatListContainer">
      </div>
    </div>
    <div class="main-content">
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages" data-chat-id="123456"> 
        </div>
        <div class="chat-input">
          <textarea type="text" class="message-input" id="messageInput" placeholder="Type your message here..."></textarea>
          <button class="send-message-button"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

    <script src="scripts/chat.js"></script>
    <script src="scripts/system.js"></script>
  </body>
</html>
